@if (movie$ | async; as movie) {
  <h1>{{ movie.title }}</h1>

  <div class="details">
    @if (movie.poster) {
      <img [ngSrc]="movie.poster" width="200" height="100" alt="Poster">
    }

    <div>
      <p>
        <span>Summary: </span>
        <span>{{ movie.summary }}</span>
      </p>
    </div>
  </div>

  <table class="horizontal">
    <tbody>
      <tr>
        <td>{{ movie.box_office | millionDollar }}</td>
        <td>{{ movie.budget | millionDollar }}</td>
        <td>{{ movie.duration | minToDuration }}</td>
        <td>{{ movie.producers.join(', ') }}</td>
        <td>{{ movie.cinematographers.join(', ') }}</td>
      </tr>
    </tbody>
  </table>
}
