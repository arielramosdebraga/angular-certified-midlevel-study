<div class="p-6 max-w-lg mx-auto bg-white shadow-lg rounded-lg mt-6">
  <h2 class="text-2x1 font-semibold text-gray-700 mg-4">Nova Categoria</h2>
  <hr />
  <form id="categoriaForm" [formGroup]="camposForm" (ngSubmit)="salvar()">
    <div class="mb-4">
      <label for="nome" class="block text-gray-600 font-medium mb-2">
        Nome
      </label>
      <input
        type="text"
        id="nome"
        name="nome"
        formControlName="nome"
        class="w-full p-3 border border-gray-300 rounded shadow-sm focus:outline-none focus:ring focus:ring-blue-400"
        required
      />

      @if (isCampoInvalido('nome')) {
        <span class="text-red-500 text-sm"> Campo Obrigatório </span>
      }
    </div>

    <div class="mb-4">
      <label for="descricao" class="block text-gray-600 font-medium mb-2">
        Descrição
      </label>
      <textarea
        id="descricao"
        name="descricao"
        rows="4"
        placeholder="Ex: Restaurantes, Praias, Shopping"
        formControlName="descricao"
        class="w-full p-3 border border-gray-300 rounded shadow-sm focus:outline-none focus=outline-none focus:ring focus:ring-blue-400"
        required
      ></textarea>

      @if (isCampoInvalido('descricao')) {
        <span class="text-red-500 text-sm"> Campo Obrigatório </span>
      }
    </div>

    <div class="flex justify-center">
      <button
        type="submit"
        class="bg-blue-500 text-white px-4 py-2 rounded disabled:bg-gray-300 hover:bg-blue-700"
        [disabled]="camposForm.invalid"
      >
        Salvar
      </button>
    </div>
  </form>
</div>
